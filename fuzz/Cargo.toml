[package]
name = "ai-protect-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1.53.1", features = ["rt"] }

[dependencies.ai-protect]
path = ".."

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_frame"
path = "fuzz_targets/read_frame.rs"
test = false
doc = false
bench = false
