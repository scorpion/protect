# Copy to config.toml and adjust for your environment:
#   cp config.example.toml config.toml
# config.toml is gitignored (see .gitignore) since a real deployment's
# addresses may be sensitive; this file is the tracked template.

[proxy]
# Address ai-protect listens on for incoming LDAP client connections.
listen_addr = "127.0.0.1:3890"
# Address of the real upstream LDAP directory this proxies to.
upstream_addr = "127.0.0.1:389"

# Uncomment to connect to upstream_addr via LDAPS (implicit TLS, typically
# port 636) instead of plaintext LDAP. server_name is used for SNI and to
# validate the upstream's certificate against its DNS name — required
# because upstream_addr above is an IP:port and directory certificates are
# usually issued for a hostname, not an IP. Set ca_file if that certificate
# is signed by an internal/enterprise CA not in the OS trust store; if
# omitted, the OS trust store is used.
# [proxy.upstream_tls]
# server_name = "dc01.corp.example.com"
# ca_file = "certs/internal-ca.pem"
#
# Uncomment if the upstream directory requires a client certificate
# (mutual TLS) on this hop.
# [proxy.upstream_tls.client_cert]
# cert_file = "certs/ai-protect-client.pem"
# key_file = "certs/ai-protect-client.key"

# Uncomment to have ai-protect itself terminate LDAPS (typically port 636)
# for incoming client connections, instead of plaintext LDAP on listen_addr.
# cert_file/key_file are PEM-encoded and their paths are resolved relative
# to the working directory ai-protect is run from.
# [proxy.listen_tls]
# cert_file = "certs/server.pem"
# key_file = "certs/server.key"
# Uncomment to require mutual TLS from connecting clients: only clients
# presenting a certificate signed by client_ca_file are accepted, so the
# proxy authenticates *which* agent is connecting instead of just trusting
# whoever can reach the socket.
# client_ca_file = "certs/agent-ca.pem"

# Maximum concurrent client connections; connections beyond this are closed
# immediately instead of queued. Defaults to 1024.
# max_connections = 1024
# Seconds allowed for any single read or write on either hop of a
# connection (TLS handshakes included) before it's dropped as stalled —
# also acts as an idle-connection timeout. Defaults to 60.
# io_timeout_secs = 60

[policy]
# Path (relative to the working directory ai-protect is run from) to the
# TOML file describing the policies to run against decoded actions, in
# order. See policies/ldap.example.toml for the schema.
file = "policies/ldap.toml"
