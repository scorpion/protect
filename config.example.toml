# Copy to config.toml and adjust for your environment:
#   cp config.example.toml config.toml
# config.toml is gitignored (see .gitignore) since a real deployment's
# addresses may be sensitive; this file is the tracked template.

# Each [[proxy]] entry is an independent listener/upstream/policy triple —
# ai-protect runs every entry concurrently, so one process can front more
# than one directory (or the same directory on more than one listen
# address/protocol variant) at once. A single-directory deployment just
# needs one [[proxy]] entry, as below.
[[proxy]]
# Address ai-protect listens on for incoming LDAP client connections.
listen_addr = "127.0.0.1:3890"
# Address(es) of the real upstream LDAP directory this proxies to. A single
# address is the common case, as below.
upstream_addrs = ["127.0.0.1:389"]

# Uncomment to load-balance across more than one address in upstream_addrs
# above (e.g. upstream_addrs = ["10.0.0.1:389", "10.0.0.2:389"]).
# "round_robin" (default) rotates through healthy targets in turn; "random"
# picks one uniformly at random; "least_connections" picks the target with
# the fewest active connections right now. If the selected target's
# connect/TLS handshake fails, ai-protect automatically tries the remaining
# configured targets before failing the client connection, and excludes the
# failed one from selection for upstream_failure_cooldown_secs. Every target
# shares the one [proxy.upstream_tls] identity below (one server_name/CA/
# client cert) — fine for a normal replica set/VIP setup where every backend
# answers for the same hostname, wrong if they're different hosts with
# per-host certificates.
# upstream_strategy = "round_robin"
#
# Seconds a target is excluded from selection after a failed connect/TLS
# handshake before it's eligible to be tried again. Defaults to 30.
# upstream_failure_cooldown_secs = 30

# Uncomment to connect to the upstream via LDAPS (implicit TLS, typically
# port 636) instead of plaintext LDAP. server_name is used for SNI and to
# validate the upstream's certificate against its DNS name — required
# because upstream_addrs entries above are IP:port and directory
# certificates are usually issued for a hostname, not an IP. Set ca_file if
# that certificate is signed by an internal/enterprise CA not in the OS
# trust store; if omitted, the OS trust store is used.
# [proxy.upstream_tls]
# server_name = "dc01.corp.example.com"
# ca_file = "certs/internal-ca.pem"
#
# Uncomment if the upstream directory requires a client certificate
# (mutual TLS) on this hop.
# [proxy.upstream_tls.client_cert]
# cert_file = "certs/ai-protect-client.pem"
# key_file = "certs/ai-protect-client.key"
#
# Uncomment if the upstream expects RFC 4511 StartTLS on its plaintext port
# instead of implicit TLS (LDAPS) on a dedicated one: ai-protect dials
# plaintext, negotiates StartTLS, then performs the handshake described by
# [proxy.upstream_tls] above.
# starttls = true

# Uncomment to have ai-protect itself terminate LDAPS (typically port 636)
# for incoming client connections, instead of plaintext LDAP on listen_addr.
# cert_file/key_file are PEM-encoded and their paths are resolved relative
# to the working directory ai-protect is run from.
# [proxy.listen_tls]
# cert_file = "certs/server.pem"
# key_file = "certs/server.key"
# Uncomment to require mutual TLS from connecting clients: only clients
# presenting a certificate signed by client_ca_file are accepted, so the
# proxy authenticates *which* agent is connecting instead of just trusting
# whoever can reach the socket.
# client_ca_file = "certs/agent-ca.pem"

# Uncomment instead of [proxy.listen_tls] to accept plaintext connections
# on listen_addr but let a client upgrade to TLS mid-session via RFC 4511
# StartTLS. Same fields as [proxy.listen_tls]; ignored if listen_tls above
# is also set (implicit TLS wins).
# [proxy.listen_starttls]
# cert_file = "certs/server.pem"
# key_file = "certs/server.key"

# Maximum concurrent client connections; connections beyond this are closed
# immediately instead of queued. Defaults to 1024.
# max_connections = 1024
# Seconds allowed for any single read or write on either hop of a
# connection (TLS handshakes included) before it's dropped as stalled —
# also acts as an idle-connection timeout. Defaults to 60.
# io_timeout_secs = 60
# Seconds a graceful shutdown (SIGTERM/SIGINT) waits for this entry's
# in-flight connections to finish on their own before aborting whatever's
# left. Defaults to 30.
# shutdown_timeout_secs = 30

[proxy.policy]
# Path (relative to the working directory ai-protect is run from) to the
# TOML file describing the policies to run against decoded actions, in
# order. See policies/ldap.example.toml for the schema. Each [[proxy]] entry
# has its own policy file — this is what lets two entries share a process
# but run different thresholds.
file = "policies/ldap.toml"

# Uncomment to front a second directory (or a second listen address/protocol
# variant of the same one) from this same process. Every [[proxy]] entry
# needs its own listen_addr and its own [proxy.policy] table; everything
# else above (TLS, connection limits) is optional per entry too.
# [[proxy]]
# listen_addr = "127.0.0.1:3891"
# upstream_addrs = ["127.0.0.1:2389"]
#
# [proxy.policy]
# file = "policies/other.toml"

# Uncomment to serve a Prometheus text-format /metrics endpoint for the
# whole process (connection counts, allow/block rates, upstream connect
# latency, TLS handshake failures) — one endpoint covering every [[proxy]]
# entry above, not one per entry. Bind it to localhost or a private network:
# nothing here authenticates scrape requests.
# [metrics]
# listen_addr = "127.0.0.1:9090"

# Uncomment to serve /healthz (liveness) and /readyz (readiness) for
# orchestrator probes (k8s livenessProbe/readinessProbe, or equivalent) —
# one endpoint for the whole process, like [metrics]. /healthz always
# answers 200; /readyz answers 200 until graceful shutdown is requested,
# then 503, so a load balancer stops routing new connections here before
# the drain itself finishes. Bind it to localhost or a private network:
# nothing here authenticates probe requests.
# [health]
# listen_addr = "127.0.0.1:9091"
