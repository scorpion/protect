# Copy to policies/ldap.toml and adjust for your environment:
#   cp policies/ldap.example.toml policies/ldap.toml
# policies/*.toml (besides this example) is gitignored — see .gitignore —
# since real thresholds and targets may be deployment-specific.
#
# Each [[policy]] table is one policy instance, run in the order declared.
# evaluate_all() stops at the first block, so put cheaper/stricter checks
# first if ordering matters. `type` selects which Policy implementation
# backs the entry; fields beyond `type` are that policy's own config.

[[policy]]
type = "threshold"
# A single request whose own blast radius exceeds this is blocked outright.
max_per_request = 10
# Total blast radius allowed per identity within window_secs.
max_per_window = 50
window_secs = 60
# scope = "per_identity" is the default and can be omitted; see the global
# backstop entry below for the other option.

# Uncomment to persist this policy's history to SQLite: it survives a
# restart (loaded back in at startup) and, if multiple ai-protect instances
# point at the same file, is approximately shared between them (each sees
# the others' admitted actions within one flush_interval_secs). Off the
# request hot path either way — evaluate() only ever touches the in-memory
# history; this is a background sync. See ARCHITECTURE.md#sqlite-backed-policy-state.
# Never point two [[policy]] entries at the same state_db file — nothing
# keys a row to which policy wrote it, so their windows would prune and
# observe each other's rows.
# state_db = "db.sqlite"
# flush_interval_secs = 2

# Alternatively, for HA across hosts with no shared disk, point state_db at
# a Valkey (https://valkey.io) or Redis instance instead of a SQLite file —
# a local one for testing is `docker compose --profile ha up -d valkey`.
# Same sharing/durability semantics as SQLite above, except the shared
# state lives in the Valkey instance rather than a shared file/volume. Two
# [[policy]] entries must use distinct key_prefix values for the same
# reason they must use distinct SQLite files.
# See ARCHITECTURE.md#valkey-backed-policy-state.
# [policy.state_db]
# url = "redis://127.0.0.1:6379"
# key_prefix = "ai_protect:threshold"

# Recommended: a second threshold entry with scope = "global", run as a
# backstop alongside the per-identity one above. A per-identity budget
# resets whenever a caller claims a fresh (and successfully-verified — see
# ARCHITECTURE.md#identity) bind DN, so a compromised credential can churn
# through many identities to stay under it. This entry ignores identity
# entirely and shares one bucket across every caller, so churning identities
# can't reset it — set max_per_window well above your expected legitimate
# aggregate traffic, since it's meant to catch runaway/bulk behavior across
# the whole proxy, not to police any one caller.
# [[policy]]
# type = "threshold"
# scope = "global"
# max_per_request = 10
# max_per_window = 4000
# window_secs = 60
