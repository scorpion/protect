[package]
name = "ai-protect"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
rasn = "0.28.14"
rasn-ldap = "0.28.14"
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12"] }
toml = "0.9.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"

# Enterprise deployments care about steady-state throughput/latency more than
# build time; LTO + a single codegen unit lets the optimizer inline and
# specialize across crate boundaries (BER decode, TLS, the relay loop).
[profile.release]
lto = true
codegen-units = 1
