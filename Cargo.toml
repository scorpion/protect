[package]
name = "ai-protect"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls", "tls-rustls-ring"] }
rasn = "0.28.14"
rasn-ldap = "0.28.14"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
